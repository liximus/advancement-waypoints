plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url "https://maven.terraformersmc.com/" }
	maven { url "https://maven.isxander.dev/releases" }
	maven { url "https://maven.isxander.dev/snapshots" }
}

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
	localProps.load(localFile.newInputStream())
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"advancement-waypoints" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

def modmenuStubDir = layout.buildDirectory.dir("generated/sources/modmenuStubs/java").get().asFile
def modmenuStubClassesDir = layout.buildDirectory.dir("generated/sources/modmenuStubs/classes").get().asFile

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "dev.isxander:yet-another-config-lib:3.9.6+26.2-fabric"

	compileOnly fileTree(dir: 'libs', include: ['*.jar'])
	clientCompileOnly files(modmenuStubClassesDir)
}

def generateModMenuStubs = tasks.register('generateModMenuStubs') {
	outputs.dir(modmenuStubDir)
	doLast {
		def apiDir = new File(modmenuStubDir, "com/terraformersmc/modmenu/api")
		apiDir.mkdirs()
		new File(apiDir, "ConfigScreenFactory.java").text = '''package com.terraformersmc.modmenu.api;
import net.minecraft.client.gui.screens.Screen;

@FunctionalInterface
public interface ConfigScreenFactory<S extends Screen> {
    S create(Screen parent);
}
'''
		new File(apiDir, "ModMenuApi.java").text = '''package com.terraformersmc.modmenu.api;

public interface ModMenuApi {
    default ConfigScreenFactory<?> getModConfigScreenFactory() {
        return parent -> null;
    }
}
'''
	}
}

def compileModMenuStubs = tasks.register('compileModMenuStubs', JavaCompile) {
	dependsOn generateModMenuStubs
	source = fileTree(modmenuStubDir)
	destinationDirectory = modmenuStubClassesDir
	classpath = sourceSets.client.compileClasspath - files(modmenuStubClassesDir)
	options.release = 25
}

tasks.named('compileClientJava') {
	dependsOn compileModMenuStubs
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Copy).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(AbstractArchiveTask).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {

	}
}

if (file('local.gradle').exists()) {
	apply from: 'local.gradle'
}
